name: Feature request
description: Suggest something Iris could do.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: Tell us the outcome you want, not the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What do you do today instead?
      description: How you handle this now, if at all.
    validations:
      required: true
